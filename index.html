<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Hero">
  <meta name="theme-color" content="#9333ea">
  <title>Math Hero - Character Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; overflow-x: hidden; position: fixed; width: 100%; height: 100%; overscroll-behavior: none; }
    html { overscroll-behavior-y: contain; }
    ::-webkit-scrollbar { display: none; }
    button, input { touch-action: manipulation; }
    input { font-size: 16px !important; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .bounce-animation { animation: bounce 0.6s ease-in-out; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    const SoundEffects = {
      context: null,
      muted: false,
      init() { if (!this.context) this.context = new (window.AudioContext || window.webkitAudioContext)(); },
      toggleMute() { this.muted = !this.muted; return this.muted; },
      playCorrect() {
        if (this.muted) return; this.init();
        const ctx = this.context, now = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = freq; osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, now + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
          osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
        });
      },
      playWrong() {
        if (this.muted) return; this.init();
        const ctx = this.context, now = ctx.currentTime;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      },
      playClick() {
        if (this.muted) return; this.init();
        const ctx = this.context, now = ctx.currentTime;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800; osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      },
      playUnlock() {
        if (this.muted) return; this.init();
        const ctx = this.context, now = ctx.currentTime;
        [{ freq: 659.25, time: 0 }, { freq: 783.99, time: 0.1 }, { freq: 1046.5, time: 0.2 }].forEach(note => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = note.freq; osc.type = 'triangle';
          gain.gain.setValueAtTime(0.3, now + note.time);
          gain.gain.exponentialRampToValueAtTime(0.01, now + note.time + 0.3);
          osc.start(now + note.time); osc.stop(now + note.time + 0.3);
        });
      },
      playVictory() {
        if (this.muted) return; this.init();
        const ctx = this.context, now = ctx.currentTime;
        [{ freq: 523.25, time: 0 }, { freq: 659.25, time: 0.15 }, { freq: 783.99, time: 0.3 }, { freq: 1046.5, time: 0.45 }].forEach(note => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = note.freq; osc.type = 'triangle';
          gain.gain.setValueAtTime(0.3, now + note.time);
          gain.gain.exponentialRampToValueAtTime(0.01, now + note.time + 0.4);
          osc.start(now + note.time); osc.stop(now + note.time + 0.4);
        });
      },
      playStart() {
        if (this.muted) return; this.init();
        const ctx = this.context, now = ctx.currentTime;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        osc.type = 'square';
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      }
    };

    const ACCESSORIES = {
      boy: [
        { id: 'cap', name: '🧢 Cap', unlockAt: 5 },
        { id: 'glasses', name: '🕶️ Glasses', unlockAt: 10 },
        { id: 'crown', name: '👑 Crown', unlockAt: 15 },
        { id: 'headphones', name: '🎧 Headphones', unlockAt: 20 },
        { id: 'trophy', name: '🏆 Trophy', unlockAt: 25 }
      ],
      girl: [
        { id: 'bow', name: '🎀 Bow', unlockAt: 5 },
        { id: 'tiara', name: '👸 Tiara', unlockAt: 10 },
        { id: 'flower', name: '🌸 Flower', unlockAt: 15 },
        { id: 'sunglasses', name: '😎 Sunglasses', unlockAt: 20 },
        { id: 'trophy', name: '🏆 Trophy', unlockAt: 25 }
      ]
    };

    function MathApp() {
      const [mode, setMode] = useState('character-select');
      const [character, setCharacter] = useState(null);
      const [operation, setOperation] = useState('addition');
      const [difficulty, setDifficulty] = useState('easy');
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [userAnswer, setUserAnswer] = useState('');
      const [score, setScore] = useState(0);
      const [questionsAnswered, setQuestionsAnswered] = useState(0);
      const [streak, setStreak] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [totalCorrect, setTotalCorrect] = useState(0);
      const [soundMuted, setSoundMuted] = useState(false);
      const [unlockedAccessories, setUnlockedAccessories] = useState([]);
      const [equippedAccessory, setEquippedAccessory] = useState(null);
      const [showUnlock, setShowUnlock] = useState(null);
      const [attemptsOnQuestion, setAttemptsOnQuestion] = useState(0);

      const toggleSound = () => {
        const newMuted = SoundEffects.toggleMute();
        setSoundMuted(newMuted);
        if (!newMuted) SoundEffects.playClick();
      };

      const difficulties = {
        easy: { min: 1, max: 10 },
        medium: { min: 5, max: 25 },
        hard: { min: 10, max: 50 }
      };

      const generateQuestion = () => {
        const range = difficulties[difficulty];
        const num1 = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
        const num2 = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
        let question, answer;

        switch (operation) {
          case 'addition':
            question = `${num1} + ${num2}`; answer = num1 + num2; break;
          case 'subtraction':
            const larger = Math.max(num1, num2), smaller = Math.min(num1, num2);
            question = `${larger} - ${smaller}`; answer = larger - smaller; break;
          case 'multiplication':
            const mult1 = Math.floor(Math.random() * 12) + 1;
            const mult2 = Math.floor(Math.random() * 12) + 1;
            question = `${mult1} × ${mult2}`; answer = mult1 * mult2; break;
          default:
            question = `${num1} + ${num2}`; answer = num1 + num2;
        }

        setCurrentQuestion({ question, answer });
        setUserAnswer('');
        setFeedback(null);
        setAttemptsOnQuestion(0);
      };

      const checkForUnlock = (newTotalCorrect) => {
        const accessories = ACCESSORIES[character];
        const nextUnlock = accessories.find(acc => 
          acc.unlockAt === newTotalCorrect && !unlockedAccessories.includes(acc.id)
        );
        
        if (nextUnlock) {
          SoundEffects.playUnlock();
          setUnlockedAccessories([...unlockedAccessories, nextUnlock.id]);
          setShowUnlock(nextUnlock);
          setTimeout(() => setShowUnlock(null), 3000);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!userAnswer) return;

        const isCorrect = parseInt(userAnswer) === currentQuestion.answer;
        
        if (isCorrect) {
          SoundEffects.playCorrect();
          const newTotalCorrect = totalCorrect + 1;
          setScore(score + 10);
          setStreak(streak + 1);
          setTotalCorrect(newTotalCorrect);
          setFeedback({ type: 'correct', message: getRandomPraise() });
          checkForUnlock(newTotalCorrect);
          
          setTimeout(() => {
            setQuestionsAnswered(questionsAnswered + 1);
            if (questionsAnswered + 1 >= 10) {
              SoundEffects.playVictory();
              setMode('results');
            } else {
              generateQuestion();
            }
          }, 1500);
        } else {
          SoundEffects.playWrong();
          
          if (attemptsOnQuestion === 0) {
            setFeedback({ type: 'retry', message: 'Try again! 🤔' });
            setAttemptsOnQuestion(1);
            setUserAnswer('');
          } else {
            setStreak(0);
            setFeedback({ type: 'incorrect', message: `The answer is ${currentQuestion.answer}` });
            
            setTimeout(() => {
              setQuestionsAnswered(questionsAnswered + 1);
              if (questionsAnswered + 1 >= 10) {
                SoundEffects.playVictory();
                setMode('results');
              } else {
                generateQuestion();
              }
            }, 2000);
          }
        }
      };

      const getRandomPraise = () => {
        const praises = ['Awesome! 🌟', 'Great job! 🎉', 'Perfect! ⭐', 'You got it! 🎊', 'Fantastic! 🌈', 'Amazing! 🚀', 'Well done! 🏆', 'Super! 💫'];
        return praises[Math.floor(Math.random() * praises.length)];
      };

      const startGame = (op, diff) => {
        SoundEffects.playStart();
        setOperation(op);
        setDifficulty(diff);
        setMode('play');
        setScore(0);
        setQuestionsAnswered(0);
        setStreak(0);
      };

      useEffect(() => {
        if (mode === 'play' && !currentQuestion) {
          generateQuestion();
        }
      }, [mode]);

      const returnToMenu = () => {
        setMode('menu');
        setCurrentQuestion(null);
      };

      const CharacterAvatar = ({ size = 'large' }) => {
        const sizes = { small: 'text-4xl', medium: 'text-6xl', large: 'text-8xl' };
        const avatarEmoji = character === 'boy' ? '👦' : '👧';
        const accessoryEmoji = equippedAccessory ? ACCESSORIES[character].find(a => a.id === equippedAccessory)?.name.split(' ')[0] : '';
        
        return (
          <div className="relative inline-block">
            <div className={sizes[size]}>{avatarEmoji}</div>
            {accessoryEmoji && (
              <div className={`absolute -top-2 -right-2 ${size === 'small' ? 'text-2xl' : 'text-4xl'}`}>
                {accessoryEmoji}
              </div>
            )}
          </div>
        );
      };

      if (mode === 'character-select') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-purple-400 via-pink-400 to-blue-400 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
              <h1 className="text-5xl font-bold text-purple-600 mb-4">✨ Math Hero ✨</h1>
              <p className="text-xl text-gray-600 mb-8">Pick your character!</p>
              
              <div className="grid grid-cols-2 gap-6 mb-6">
                <button
                  onClick={() => { SoundEffects.playClick(); setCharacter('boy'); setMode('menu'); }}
                  className="bg-blue-100 hover:bg-blue-200 rounded-2xl p-8 transition-all active:scale-95"
                >
                  <div className="text-8xl mb-3">👦</div>
                  <div className="text-2xl font-bold text-blue-700">Boy</div>
                </button>
                
                <button
                  onClick={() => { SoundEffects.playClick(); setCharacter('girl'); setMode('menu'); }}
                  className="bg-pink-100 hover:bg-pink-200 rounded-2xl p-8 transition-all active:scale-95"
                >
                  <div className="text-8xl mb-3">👧</div>
                  <div className="text-2xl font-bold text-pink-700">Girl</div>
                </button>
              </div>
              
              <button onClick={toggleSound} className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-2xl mx-auto">
                {soundMuted ? '🔇' : '🔊'}
              </button>
            </div>
          </div>
        );
      }

      if (mode === 'menu') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-purple-400 via-pink-400 to-blue-400 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-md w-full relative">
              <button onClick={toggleSound} className="absolute top-4 right-4 w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-2xl active:scale-95">
                {soundMuted ? '🔇' : '🔊'}
              </button>
              
              <div className="text-center mb-6">
                <CharacterAvatar />
                <h2 className="text-3xl font-bold text-purple-600 mt-4">Ready to play?</h2>
                <p className="text-gray-600 mt-2">Total Stars: ⭐ {totalCorrect}</p>
              </div>

              {unlockedAccessories.length > 0 && (
                <div className="mb-6 p-4 bg-purple-50 rounded-2xl">
                  <h3 className="text-lg font-bold text-purple-700 mb-3">Your Collection:</h3>
                  <div className="grid grid-cols-3 gap-2">
                    {ACCESSORIES[character].filter(acc => unlockedAccessories.includes(acc.id)).map(acc => (
                      <button
                        key={acc.id}
                        onClick={() => { SoundEffects.playClick(); setEquippedAccessory(equippedAccessory === acc.id ? null : acc.id); }}
                        className={`p-3 rounded-xl text-2xl transition-all ${equippedAccessory === acc.id ? 'bg-purple-500 text-white scale-105' : 'bg-white hover:bg-purple-100'}`}
                      >
                        {acc.name.split(' ')[0]}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div className="space-y-5">
                <div>
                  <h3 className="text-xl font-bold text-gray-800 mb-3">What do you want to practice?</h3>
                  <div className="grid grid-cols-1 gap-3">
                    <button onClick={() => { SoundEffects.playClick(); setOperation('addition'); }} className={`p-5 rounded-2xl text-xl font-bold transition-all active:scale-95 ${operation === 'addition' ? 'bg-green-500 text-white shadow-xl' : 'bg-green-100 text-green-700'}`}>
                      ➕ Addition
                    </button>
                    <button onClick={() => { SoundEffects.playClick(); setOperation('subtraction'); }} className={`p-5 rounded-2xl text-xl font-bold transition-all active:scale-95 ${operation === 'subtraction' ? 'bg-orange-500 text-white shadow-xl' : 'bg-orange-100 text-orange-700'}`}>
                      ➖ Subtraction
                    </button>
                    <button onClick={() => { SoundEffects.playClick(); setOperation('multiplication'); }} className={`p-5 rounded-2xl text-xl font-bold transition-all active:scale-95 ${operation === 'multiplication' ? 'bg-blue-500 text-white shadow-xl' : 'bg-blue-100 text-blue-700'}`}>
                      ✖️ Multiplication
                    </button>
                  </div>
                </div>

                <div>
                  <h3 className="text-xl font-bold text-gray-800 mb-3">How hard?</h3>
                  <div className="grid grid-cols-3 gap-2">
                    <button onClick={() => { SoundEffects.playClick(); setDifficulty('easy'); }} className={`p-4 rounded-xl text-base font-bold transition-all active:scale-95 ${difficulty === 'easy' ? 'bg-yellow-400 text-white shadow-lg' : 'bg-yellow-100 text-yellow-700'}`}>
                      😊 Easy
                    </button>
                    <button onClick={() => { SoundEffects.playClick(); setDifficulty('medium'); }} className={`p-4 rounded-xl text-base font-bold transition-all active:scale-95 ${difficulty === 'medium' ? 'bg-purple-400 text-white shadow-lg' : 'bg-purple-100 text-purple-700'}`}>
                      🤔 Medium
                    </button>
                    <button onClick={() => { SoundEffects.playClick(); setDifficulty('hard'); }} className={`p-4 rounded-xl text-base font-bold transition-all active:scale-95 ${difficulty === 'hard' ? 'bg-red-400 text-white shadow-lg' : 'bg-red-100 text-red-700'}`}>
                      🔥 Hard
                    </button>
                  </div>
                </div>

                <button onClick={() => startGame(operation, difficulty)} className="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white text-2xl font-bold py-6 rounded-2xl active:scale-95 transition-all shadow-lg">
                  Start Playing! 🎮
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (mode === 'results') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-yellow-400 via-orange-400 to-pink-400 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-md w-full text-center relative">
              <button onClick={toggleSound} className="absolute top-4 right-4 w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-2xl active:scale-95">
                {soundMuted ? '🔇' : '🔊'}
              </button>
              
              <div className="mb-6">
                <CharacterAvatar size="large" />
                <h1 className="text-5xl font-bold text-purple-600 mt-4 mb-2">Great Job!</h1>
              </div>

              <div className="bg-gradient-to-br from-purple-100 to-blue-100 rounded-2xl p-8 mb-6">
                <div className="text-6xl font-bold text-purple-600 mb-2">{score}</div>
                <div className="text-2xl text-gray-700">Total Points</div>
              </div>

              <div className="grid grid-cols-2 gap-4 mb-8">
                <div className="bg-green-100 rounded-xl p-5">
                  <div className="text-3xl font-bold text-green-600">{totalCorrect}</div>
                  <div className="text-gray-600">Total Stars</div>
                </div>
                <div className="bg-blue-100 rounded-xl p-5">
                  <div className="text-3xl font-bold text-blue-600">{streak}</div>
                  <div className="text-gray-600">Best Streak</div>
                </div>
              </div>

              <button onClick={() => { SoundEffects.playClick(); setMode('menu'); }} className="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white text-2xl font-bold py-5 rounded-xl active:scale-95 transition-all shadow-lg">
                Play Again 🔄
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-400 via-purple-400 to-pink-400 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-md w-full relative">
            {showUnlock && (
              <div className="absolute top-0 left-0 right-0 bg-yellow-400 text-white text-center py-4 rounded-t-3xl z-20 bounce-animation">
                <div className="text-2xl font-bold">🎉 Unlocked! 🎉</div>
                <div className="text-lg">{showUnlock.name}</div>
              </div>
            )}
            
            <button onClick={toggleSound} className="absolute top-4 right-4 w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-2xl active:scale-95 z-10">
              {soundMuted ? '🔇' : '🔊'}
            </button>
            
            <div className="flex justify-between items-center mb-6">
              <div className="bg-purple-100 rounded-xl px-4 py-3 flex-1 mr-2">
                <div className="text-xs text-purple-600 font-semibold">Score</div>
                <div className="text-2xl font-bold text-purple-700">{score}</div>
              </div>
              <div className="bg-blue-100 rounded-xl px-4 py-3 flex-1 mx-1">
                <div className="text-xs text-blue-600 font-semibold">Question</div>
                <div className="text-2xl font-bold text-blue-700">{questionsAnswered + 1}/10</div>
              </div>
              <div className="bg-yellow-100 rounded-xl px-4 py-3 flex-1 ml-2">
                <div className="text-xs text-yellow-600 font-semibold">Stars</div>
                <div className="text-2xl font-bold text-yellow-700">⭐{totalCorrect}</div>
              </div>
            </div>

            <div className="text-center mb-4">
              <CharacterAvatar size="small" />
            </div>

            {currentQuestion && (
              <div className="text-center mb-6">
                <div className="bg-gradient-to-br from-purple-100 to-blue-100 rounded-2xl p-10 mb-6">
                  <div className="text-7xl font-bold text-purple-700 mb-2">{currentQuestion.question}</div>
                  <div className="text-4xl text-purple-600">= ?</div>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <input
                    type="number"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    value={userAnswer}
                    onChange={(e) => setUserAnswer(e.target.value)}
                    className="w-full text-5xl font-bold text-center p-6 border-4 border-purple-300 rounded-2xl focus:border-purple-500 focus:outline-none"
                    placeholder="?"
                    autoFocus
                    disabled={feedback?.type === 'incorrect'}
                  />
                  
                  {feedback?.type !== 'incorrect' && (
                    <button type="submit" className="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white text-3xl font-bold py-6 rounded-2xl active:scale-95 transition-all shadow-lg">
                      Check Answer ✓
                    </button>
                  )}
                </form>

                {feedback && (
                  <div className={`mt-6 p-6 rounded-2xl text-3xl font-bold ${
                    feedback.type === 'correct' ? 'bg-green-100 text-green-700' :
                    feedback.type === 'retry' ? 'bg-yellow-100 text-yellow-700' :
                    'bg-orange-100 text-orange-700'
                  }`}>
                    {feedback.message}
                  </div>
                )}
              </div>
            )}

            <button onClick={() => { SoundEffects.playClick(); returnToMenu(); }} className="w-full bg-gray-200 text-gray-700 text-lg font-semibold py-4 rounded-xl active:scale-95 transition-all">
              Back to Menu
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MathApp />);
  </script>
</body>
</html>
